<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE SETLIST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#fbf8fc; --bg-1:#f3eefa;
    --surface:#ffffff; --surface-2:#f6f1fc;
    --border:#e3dbf2; --border-soft:#ece5f7;
    --text:#332d45; --text-dim:#6f6685; --text-faint:#948c9e;
    --accent:#ff9db7; --accent-deep:#ff7ca0; --accent-2:#9b8cff;
    --accent-text:#c93d70; --accent2-text:#6c4fe0;
    --ok:#6fd9b0; --ok-text:#178a68;
    --danger:#ff7a90; --danger-text:#d43b58;
    --shadow-sm:0 4px 14px rgba(155,140,190,.18);
    --shadow-lg:0 20px 50px rgba(155,140,190,.3);
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Dela Gothic One',sans-serif;
    --font-card:'Zen Maru Gothic',sans-serif;
    --font-body:'Zen Kaku Gothic New',sans-serif;
    --font-led:'DotGothic16',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 18% -10%, rgba(255,157,183,.20), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(155,140,255,.14), transparent 55%),
      var(--bg-0);
    color:var(--text);font-family:var(--font-body);line-height:1.5;
    padding:28px 18px 60px;
  }
  .wrap{max-width:700px;margin:0 auto;}

  /* header */
  header{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
  .site-icon{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:radial-gradient(circle at 35% 30%, #ffd9a8, var(--accent) 55%, var(--accent-deep) 100%);
    box-shadow:0 0 0 3px rgba(255,157,183,.16),0 0 20px rgba(255,157,183,.40);
  }
  .title-block h1{
    font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.06em;margin:0 0 2px;
    background:linear-gradient(95deg,var(--accent2-text),var(--accent-text) 55%,var(--accent-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .title-block p{margin:0;font-size:12px;color:var(--text-dim);}
  .live-tag{
    margin-left:auto;font-family:var(--font-led);font-size:11px;letter-spacing:.12em;
    color:var(--accent2-text);border:1px solid rgba(155,140,255,.4);background:rgba(155,140,255,.10);
    padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:7px;
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2-text);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  /* empty state */
  #empty-state{
    text-align:center;padding:60px 20px;border:1px dashed var(--border);border-radius:var(--radius-lg);
  }
  #empty-state .big{font-family:var(--font-card);font-size:18px;color:var(--text-dim);margin-bottom:8px;}
  #empty-state p{font-size:13px;color:var(--text-faint);}

  /* NOW PLAYING */
  #now-playing-wrap{margin-bottom:20px;}
  .section-label{
    font-family:var(--font-led);font-size:11px;letter-spacing:.14em;color:var(--text-faint);
    text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;}

  .now-card{
    background:linear-gradient(145deg,#fff,var(--bg-1));
    border:2px solid var(--accent);border-radius:var(--radius-lg);
    padding:24px 26px;box-shadow:var(--shadow-lg), 0 0 0 4px rgba(255,157,183,.12);
    position:relative;overflow:hidden;
  }
  .now-card::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,157,183,.08),rgba(155,140,255,.06));
    pointer-events:none;
  }
  .now-num{
    font-family:var(--font-led);font-size:12px;color:var(--accent-text);
    letter-spacing:.08em;margin-bottom:10px;
  }
  .now-title{
    font-family:var(--font-card);font-size:28px;font-weight:700;
    word-break:break-word;line-height:1.3;margin-bottom:6px;color:var(--text);
  }
  .now-artist{font-size:16px;color:var(--accent2-text);font-weight:500;}
  .now-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .badge{font-size:11.5px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;}
  .badge.milishiri{color:var(--accent-text);background:rgba(255,157,183,.15);border-color:rgba(255,157,183,.4);}
  .now-notes{font-size:13px;color:var(--text-faint);font-style:italic;margin-top:8px;}

  .next-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;margin-top:18px;padding:13px;border-radius:var(--radius-md);
    background:linear-gradient(95deg,var(--accent),var(--accent-deep));
    border:none;color:white;font-family:var(--font-body);font-size:15px;font-weight:700;
    cursor:pointer;transition:filter .15s, transform .1s;box-shadow:var(--shadow-sm);
  }
  .next-btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .next-btn:active{transform:translateY(0);}
  .next-btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none;}
  svg.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* Queue */
  #queue-wrap{margin-bottom:20px;}
  .queue-list{display:flex;flex-direction:column;gap:8px;}
  .queue-card{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius-md);padding:11px 14px;box-shadow:var(--shadow-sm);
  }
  .queue-num{font-family:var(--font-led);font-size:12px;color:var(--text-faint);flex:0 0 24px;}
  .queue-body{flex:1 1 auto;min-width:0;}
  .queue-title{font-family:var(--font-card);font-size:14px;font-weight:500;word-break:break-word;}
  .queue-artist{font-size:12px;color:var(--accent2-text);}

  /* History */
  #history-wrap{}
  .section-label.history .dot{background:var(--ok);}
  .history-list{display:flex;flex-direction:column;gap:6px;}
  .history-card{
    display:flex;align-items:center;gap:10px;
    background:rgba(111,217,176,.06);border:1px solid rgba(111,217,176,.25);
    border-radius:var(--radius-sm);padding:9px 12px;
  }
  .history-num{font-family:var(--font-led);font-size:11px;color:var(--ok-text);flex:0 0 22px;}
  .history-body{flex:1 1 auto;min-width:0;}
  .history-title{font-size:13.5px;font-family:var(--font-card);font-weight:500;word-break:break-word;color:var(--text-dim);}
  .history-artist{font-size:11.5px;color:var(--text-faint);}
  .check-icon{flex:0 0 auto;color:var(--ok-text);font-size:14px;}

  /* controls */
  .ctrl-bar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:16px;flex-wrap:wrap;}
  button.ctrl{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-dim);padding:7px 14px;font-size:12.5px;font-family:var(--font-body);cursor:pointer;
  }
  button.ctrl:hover{border-color:var(--accent);color:var(--accent-text);}
  button.ctrl.danger:hover{border-color:var(--danger);color:var(--danger-text);}

  /* request memo */
  #request-wrap{margin-bottom:20px;}
  .req-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;user-select:none;}
  .req-head .section-label{margin:0;flex:1 1 auto;}
  .req-toggle{font-family:var(--font-led);font-size:11px;color:var(--text-faint);transition:transform .2s;}
  .req-toggle.open{transform:rotate(90deg);}
  .req-body{display:none;}
  .req-body.open{display:block;}
  .req-input-row{display:flex;gap:8px;margin-bottom:10px;}
  .req-input{
    flex:1 1 auto;font-family:var(--font-body);background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .req-input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(155,140,255,.18);}
  .req-input::placeholder{color:var(--text-faint);}
  .req-add-btn{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-sm);
    background:rgba(155,140,255,.15);border:1px solid rgba(155,140,255,.4);color:var(--accent2-text);
    padding:9px 14px;font-size:13px;font-family:var(--font-body);font-weight:600;
  }
  .req-add-btn:hover{background:rgba(155,140,255,.25);}
  .req-list{display:flex;flex-direction:column;gap:7px;}
  .req-card{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid rgba(155,140,255,.25);
    border-radius:var(--radius-sm);padding:9px 12px;position:relative;overflow:hidden;
  }
  .req-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-2);}
  .req-card.done{opacity:.45;border-color:var(--border);}
  .req-card.done::before{background:var(--ok);}
  .req-card.done .req-text{text-decoration:line-through;color:var(--text-faint);}
  .req-no{font-family:var(--font-led);font-size:11px;color:var(--accent2-text);flex:0 0 18px;}
  .req-card.done .req-no{color:var(--ok-text);}
  .req-text{flex:1 1 auto;font-size:14px;word-break:break-word;}
  .req-done-btn{
    flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
    background:rgba(155,140,255,.10);border:1px solid rgba(155,140,255,.3);color:var(--accent2-text);
  }
  .req-done-btn:hover{background:rgba(111,217,176,.18);border-color:var(--ok);color:var(--ok-text);}
  .req-card.done .req-done-btn{background:rgba(111,217,176,.12);border-color:var(--ok);color:var(--ok-text);}
  .req-del-btn{
    flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
  }
  .req-del-btn:hover{border-color:var(--danger);color:var(--danger-text);}
  .req-empty{font-size:12.5px;color:var(--text-faint);text-align:center;padding:10px;}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow-lg);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.ok{border-color:var(--ok);color:var(--ok-text);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="site-icon">🎤</div>
    <div class="title-block">
      <h1>LIVE SETLIST</h1>
      <p>本日の歌枠セットリスト</p>
    </div>
    <div class="live-tag"><span class="live-dot"></span>LIVE</div>
  </header>

  <div class="ctrl-bar">
    <button class="ctrl" id="undo-btn" disabled>
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 10h10c4 0 7 3 7 7s-3 7-7 7"/><path d="M3 10l4-4M3 10l4 4"/></svg>
      1つ戻す
    </button>
    <button class="ctrl danger" id="reset-btn">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      リセット
    </button>
  </div>

  <!-- 空状態 -->
  <div id="empty-state">
    <div class="big">セットリストがありません</div>
    <p>編集ページの「本日歌った曲リスト」からライブページを開いてください</p>
  </div>

  <!-- NOW PLAYING -->
  <div id="now-playing-wrap" style="display:none;">
    <div class="section-label"><span class="dot"></span>NOW PLAYING</div>
    <div class="now-card">
      <div class="now-num" id="now-num"></div>
      <div class="now-title" id="now-title"></div>
      <div class="now-artist" id="now-artist"></div>
      <div class="now-meta" id="now-meta"></div>
      <div class="now-notes" id="now-notes"></div>
      <button class="next-btn" id="next-btn">
        次の曲へ
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- Queue -->
  <div id="queue-wrap" style="display:none;">
    <div class="section-label">NEXT</div>
    <div class="queue-list" id="queue-list"></div>
  </div>

  <!-- History -->
  <div id="history-wrap" style="display:none;">
    <div class="section-label history"><span class="dot"></span>歌い終わった曲 <span id="history-count" style="font-size:11px;color:var(--ok-text);font-family:var(--font-led);margin-left:6px;"></span></div>
    <div style="padding:10px 0 4px;">
      <button class="ctrl" id="open-history-btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
        歌ったリストを別ページで開く
      </button>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- Request Memo -->
  <div id="request-wrap">
    <div class="req-head" id="req-head">
      <div class="section-label">
        <span style="color:var(--accent2-text);">💜</span> リクエストメモ
        <span id="req-badge" style="font-family:var(--font-led);font-size:10px;color:var(--accent2-text);margin-left:6px;background:rgba(155,140,255,.15);border:1px solid rgba(155,140,255,.3);padding:1px 7px;border-radius:999px;display:none;"></span>
      </div>
      <span class="req-toggle" id="req-toggle">▶</span>
    </div>
    <div class="req-body" id="req-body">
      <div class="req-input-row">
        <input type="text" class="req-input" id="req-input" placeholder="曲名やリクエスト内容を入力…" maxlength="100">
        <button class="req-add-btn" id="req-add-btn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          追加
        </button>
      </div>
      <div class="req-list" id="req-list">
        <div class="req-empty">リクエストはまだありません</div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px;">
        <button class="ctrl" id="req-clear-done-btn" style="font-size:11.5px;padding:5px 12px;">対応済みをまとめて削除</button>
      </div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
(function(){
  'use strict';

  const LS_KEY = 'utawaku_live_state';
  const BC_NAME = 'utawaku_live';

  let state = { queue:[], current:null, history:[] };
  let bc = null;

  try { bc = new BroadcastChannel(BC_NAME); } catch(e){}

  function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function showToast(msg, type){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (type ? ' '+type : '');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>{ t.className=''; }, 2000);
  }

  function saveState(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if (raw) state = JSON.parse(raw);
    } catch(e){}
  }

  function render(){
    const el = {
      empty:      document.getElementById('empty-state'),
      nowWrap:    document.getElementById('now-playing-wrap'),
      queueWrap:  document.getElementById('queue-wrap'),
      histWrap:   document.getElementById('history-wrap'),
      nowNum:     document.getElementById('now-num'),
      nowTitle:   document.getElementById('now-title'),
      nowArtist:  document.getElementById('now-artist'),
      nowMeta:    document.getElementById('now-meta'),
      nowNotes:   document.getElementById('now-notes'),
      nextBtn:    document.getElementById('next-btn'),
      queueList:  document.getElementById('queue-list'),
      histList:   document.getElementById('history-list'),
      undoBtn:    document.getElementById('undo-btn'),
    };

    const hasAnything = state.current || state.queue.length > 0 || state.history.length > 0;

    el.empty.style.display = hasAnything ? 'none' : 'block';
    el.nowWrap.style.display = state.current ? 'block' : 'none';
    el.queueWrap.style.display = state.queue.length > 0 ? 'block' : 'none';
    el.histWrap.style.display = state.history.length > 0 ? 'block' : 'none';
    el.undoBtn.disabled = state.history.length === 0;

    // NOW PLAYING
    if (state.current){
      const s = state.current;
      const total = state.history.length + 1 + state.queue.length;
      const cur = state.history.length + 1;
      el.nowNum.textContent = `${cur} / ${total}`;
      el.nowTitle.textContent = s.title || '(無題)';
      el.nowArtist.textContent = s.artist ? `🎙 ${s.artist}` : '';
      el.nowMeta.innerHTML = [
        s.work ? `<span class="badge">📀 ${esc(s.work)}</span>` : '',
        s.releaseYear ? `<span class="badge">📅 ${esc(s.releaseYear)}</span>` : '',
        s.milishiri ? `<span class="badge milishiri">🎵 ミリしり</span>` : ''
      ].join('');
      el.nowNotes.textContent = s.notes ? `💬 ${s.notes}` : '';
      el.nextBtn.disabled = state.queue.length === 0;
      el.nextBtn.textContent = state.queue.length > 0 ? '次の曲へ →' : '✓ セットリスト終了';
    }

    // QUEUE
    if (state.queue.length > 0){
      const offset = state.history.length + 2;
      el.queueList.innerHTML = state.queue.map((s,i) => `
        <div class="queue-card">
          <span class="queue-num">${offset+i}</span>
          <div class="queue-body">
            <div class="queue-title">${esc(s.title)||'(無題)'}</div>
            ${s.artist ? `<div class="queue-artist">${esc(s.artist)}</div>` : ''}
          </div>
        </div>`).join('');
    }

    // HISTORY count & compact preview
    const hc = document.getElementById('history-count');
    if (hc) hc.textContent = state.history.length + '曲';
    if (state.history.length > 0){
      el.histList.innerHTML = [...state.history].reverse().slice(0, 3).map((s,i) => {
        const no = state.history.length - i;
        return `
        <div class="history-card">
          <span class="history-num">${no}</span>
          <div class="history-body">
            <div class="history-title">${esc(s.title)||'(無題)'}</div>
            ${s.artist ? `<div class="history-artist">${esc(s.artist)}</div>` : ''}
          </div>
          <span class="check-icon">✓</span>
        </div>`;
      }).join('') + (state.history.length > 3 ? `<div style="text-align:center;padding:6px;font-size:11.5px;color:var(--text-faint);">他 ${state.history.length - 3} 曲… （歌ったリストページで全件確認）</div>` : '');
    }
  }

  function broadcastState(){
    if (bc) bc.postMessage({ type: 'state_update', state });
  }

  function nextSong(){
    if (!state.current) return;
    state.history.push(state.current);
    state.current = state.queue.length > 0 ? state.queue.shift() : null;
    saveState(); broadcastState(); render();
    if (!state.current) showToast('セットリスト終了！お疲れ様でした 🎤', 'ok');
  }

  function undoSong(){
    if (state.history.length === 0) return;
    if (state.current) state.queue.unshift(state.current);
    state.current = state.history.pop();
    saveState(); broadcastState(); render();
  }

  function resetAll(){
    if (!confirm('セットリストをリセットしますか？')) return;
    state = { queue:[], current:null, history:[] };
    saveState(); broadcastState(); render();
  }

  // BroadcastChannelで編集ページからの更新を受信
  if (bc){
    bc.onmessage = (e) => {
      if (e.data && e.data.type === 'setlist_push'){
        const songs = e.data.songs || [];
        if (songs.length === 0) return;
        state = {
          current: songs[0],
          queue: songs.slice(1),
          history: []
        };
        saveState();
        render();
        showToast(`${songs.length}曲のセットリストを受信しました`, 'ok');
      }
    };
  }

  document.getElementById('next-btn').addEventListener('click', nextSong);
  document.getElementById('undo-btn').addEventListener('click', undoSong);
  document.getElementById('reset-btn').addEventListener('click', resetAll);

  document.addEventListener('click', (e) => {
    if (e.target.closest('#open-history-btn')) {
      window.open('./history.html', 'utawaku_history');
    }
  });

  /* ===== リクエストメモ ===== */
  const REQ_KEY = 'utawaku_requests';
  let requests = [];

  function loadRequests(){
    try{ const r=localStorage.getItem(REQ_KEY); if(r) requests=JSON.parse(r); } catch(e){}
  }

  function saveRequests(){
    try{ localStorage.setItem(REQ_KEY, JSON.stringify(requests)); } catch(e){}
  }

  function renderRequests(){
    const list = document.getElementById('req-list');
    const badge = document.getElementById('req-badge');
    const pending = requests.filter(r=>!r.done).length;
    if (pending > 0){
      badge.style.display='inline';
      badge.textContent = pending + '件';
    } else {
      badge.style.display='none';
    }
    if (requests.length === 0){
      list.innerHTML = '<div class="req-empty">リクエストはまだありません</div>';
      return;
    }
    list.innerHTML = requests.map((r,i) => `
      <div class="req-card${r.done?' done':''}" data-req-i="${i}">
        <span class="req-no">${i+1}</span>
        <span class="req-text">${esc(r.text)}</span>
        <button class="req-done-btn" data-req-done="${i}" title="${r.done?'未対応に戻す':'対応済みにする'}">
          <svg class="icon" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </button>
        <button class="req-del-btn" data-req-del="${i}" title="削除">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>`).join('');
  }

  function addRequest(){
    const input = document.getElementById('req-input');
    const text = input.value.trim();
    if (!text) return;
    requests.push({ text, done:false, at: Date.now() });
    saveRequests();
    renderRequests();
    input.value = '';
    input.focus();
  }

  // トグル開閉
  document.getElementById('req-head').addEventListener('click', () => {
    const body = document.getElementById('req-body');
    const toggle = document.getElementById('req-toggle');
    body.classList.toggle('open');
    toggle.classList.toggle('open');
  });

  document.getElementById('req-add-btn').addEventListener('click', addRequest);
  document.getElementById('req-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addRequest();
  });

  document.getElementById('req-list').addEventListener('click', (e) => {
    const doneBtn = e.target.closest('[data-req-done]');
    const delBtn  = e.target.closest('[data-req-del]');
    if (doneBtn){
      const i = Number(doneBtn.dataset.reqDone);
      requests[i].done = !requests[i].done;
      saveRequests(); renderRequests();
    } else if (delBtn){
      const i = Number(delBtn.dataset.reqDel);
      requests.splice(i, 1);
      saveRequests(); renderRequests();
    }
  });

  document.getElementById('req-clear-done-btn').addEventListener('click', () => {
    const doneCount = requests.filter(r=>r.done).length;
    if (doneCount === 0){ showToast('対応済みのリクエストはありません'); return; }
    if (!confirm(`対応済み ${doneCount} 件を削除しますか？`)) return;
    requests = requests.filter(r=>!r.done);
    saveRequests(); renderRequests();
  });

  loadRequests();
  renderRequests();

  // 初期ロード
  loadState();
  render();

})();
</script>
</body>
</html>
